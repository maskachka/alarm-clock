[platformio]
default_envs = mhetesp32devkit

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:mhetesp32devkit]
platform = espressif32
board = mhetesp32devkit
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter =
	+<*>
	-<main_desktop.cpp>
lib_deps = 
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
	bodmer/TFT_eSPI@^2.5.43
	lvgl/lvgl@^9.5.0
; Configure credentials via build flags instead of hardcoding in source.
build_flags =
	-I include
	-D LV_CONF_INCLUDE_SIMPLE
	-D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
	-D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
	-D LV_BUILD_EXAMPLES=0
	-D LV_USE_ILI9341=0
monitor_speed = 115200

[env:desktop]
platform = native
build_src_filter =
	+<*>
	-<main_esp32.cpp>
lib_deps =
	.pio/libdeps/mhetesp32devkit/lvgl
build_flags =
	-I include
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_USE_X11=1
	-D LV_USE_TFT_ESPI=0
	-D LV_USE_ILI9341=0
	-D LV_USE_IMAGE=1
	!pkg-config --cflags x11
	!pkg-config --libs x11

[env:native_test]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
	+<alarm_service.cpp>
	+<clock_app_controller.cpp>
	+<clock_formatter.cpp>
build_flags =
	-I include
